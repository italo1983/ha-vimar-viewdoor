name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'quii-helper==0.2.0' pytest ruff
      - run: ruff check .
      - run: python -m compileall -q custom_components
      - run: pytest -q
